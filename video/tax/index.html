<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=720, height=1280" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 720px; height: 1280px; overflow: hidden; background: #F7F3EE; }
      #root { width: 100%; height: 100%; position: relative; font-family: "Outfit", sans-serif; }
      #ground { position: absolute; inset: 0; background: #F7F3EE; overflow: hidden; z-index: 0; }
      .ground-blob { position: absolute; border-radius: 50%; }
      #ground-a { width: 900px; height: 900px; top: -420px; right: -380px; background: radial-gradient(circle, rgba(255, 102, 0, 0.18), transparent 62%); }
      #ground-b { width: 800px; height: 800px; bottom: -380px; left: -340px; background: radial-gradient(circle, rgba(120, 81, 169, 0.15), transparent 64%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="49" data-width="720" data-height="1280">
      <div id="ground" class="clip" data-start="0" data-duration="39" data-track-index="0" data-layout-ignore>
        <div id="ground-a" class="ground-blob"></div>
        <div id="ground-b" class="ground-blob"></div>
      </div>

      <div id="t1" data-composition-id="t1" data-composition-src="compositions/t1.html" data-start="0" data-duration="10"
        data-track-index="1" data-track-kind="graphics" data-width="720" data-height="1280" style="z-index: 2"></div>
      <div id="t2" data-composition-id="t2" data-composition-src="compositions/t2.html" data-start="10" data-duration="9.6"
        data-track-index="2" data-track-kind="graphics" data-width="720" data-height="1280" style="z-index: 2"></div>
      <div id="t3" data-composition-id="t3" data-composition-src="compositions/t3.html" data-start="19.6" data-duration="7.9"
        data-track-index="3" data-track-kind="graphics" data-width="720" data-height="1280" style="z-index: 2"></div>
      <div id="t4" data-composition-id="t4" data-composition-src="compositions/t4.html" data-start="27.5" data-duration="9"
        data-track-index="4" data-track-kind="graphics" data-width="720" data-height="1280" style="z-index: 2"></div>
      <div id="tburst" data-composition-id="tburst" data-composition-src="compositions/tburst.html" data-start="36.5" data-duration="2.5"
        data-track-index="5" data-track-kind="graphics" data-width="720" data-height="1280" style="z-index: 3"></div>

      <!-- 10 s outro: the same Remotion logo + offer, laid out for portrait (video/outro, OutroVertical) -->
      <video id="outro" class="clip" data-start="39" data-duration="10" data-track-index="6" src="assets/footage/outro.mp4"
        muted playsinline style="position: absolute; left: 0; top: 0; width: 720px; height: 1280px; z-index: 4"></video>

      <audio id="sfx" class="clip" data-start="0" data-duration="49" data-track-index="7" data-volume="1" src="assets/sfx/sfx.wav"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#ground-a", { x: 0, y: 0 }, { x: -120, y: 80, duration: 39, ease: "sine.inOut" }, 0);
      tl.fromTo("#ground-b", { x: 0, y: 0 }, { x: 110, y: -60, duration: 39, ease: "sine.inOut" }, 0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
