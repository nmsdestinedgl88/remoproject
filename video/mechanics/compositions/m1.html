    (function () {
      const tl = gsap.timeline({ paused: true });
      const $ = (s) => document.querySelectorAll(s);
      const FULL = { x: 0, y: 0, scale: 1, rotationY: 0 };
      const CARD_R = { x: 0, y: 150, scale: 0.66, rotationY: -16 };

      const R0 = "inset(0px 0px 0px 0px round 0px)";
      const R = "inset(0px 0px 0px 0px round 48px)";
      const wordIn = (el, at) =>

        tl.to(sel, { opacity: 0, filter: "blur(8px)", duration: 0.16, ease: "power2.in", stagger: 0.02 }, at);

      const pose = (p, clip, at, d, ease) => {
        tl.to("#m1-card", { ...p, duration: d, ease }, at);

      words("#m1-t1", [1.33, 1.44, 1.92]);
      words("#m1-t2", [2.24, 2.36, 2.45]);
      out("#m1-t1 .w, #m1-t2 .w", 2.82);

      tl.to("#m1-scrim", { opacity: 1, duration: 0.4, ease: "power2.out" }, 3.6);
      words("#m1-t3", [4.25, 4.42, 4.78]);
      tl.fromTo("#m1-t4 .w", { opacity: 0, scale: 1.3, filter: "blur(12px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.18, ease: "expo.out" }, 5.01);

      tl.to("#m1-card", { keyframes: [{ x: -10, y: 5 }, { x: 8, y: -4 }, { x: -4, y: 2 }, { x: 0, y: 0 }], duration: 0.3, ease: "none" }, 5.02);
      out("#m1-t3 .w, #m1-t4 .w", 5.86);
      tl.to("#m1-scrim", { opacity: 0, duration: 0.3, ease: "power2.in" }, 5.86);
