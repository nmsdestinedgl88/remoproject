<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=720, height=1280" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 720px; height: 1280px; overflow: hidden; background: #F7F3EE; }
      #root { width: 100%; height: 100%; position: relative; font-family: "Outfit", sans-serif; }
      #ground { position: absolute; inset: 0; background: #F7F3EE; overflow: hidden; z-index: 0; }
      .ground-blob { position: absolute; border-radius: 50%; }
      #ground-a { width: 900px; height: 900px; top: -420px; right: -380px; background: radial-gradient(circle, rgba(255, 102, 0, 0.18), transparent 62%); }
      #ground-b { width: 800px; height: 800px; bottom: -380px; left: -340px; background: radial-gradient(circle, rgba(120, 81, 169, 0.15), transparent 64%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="40" data-width="720" data-height="1280">
      <div id="ground" class="clip" data-start="0" data-duration="30" data-track-index="0" data-layout-ignore>
        <div id="ground-a" class="ground-blob"></div>
        <div id="ground-b" class="ground-blob"></div>
      </div>

      <div id="m1" data-composition-id="m1" data-composition-src="compositions/m1.html" data-start="0" data-duration="9.35"
        data-track-index="1" data-track-kind="graphics" data-width="720" data-height="1280" style="z-index: 2"></div>
      <div id="m2" data-composition-id="m2" data-composition-src="compositions/m2.html" data-start="9.35" data-duration="9.6"
        data-track-index="2" data-track-kind="graphics" data-width="720" data-height="1280" style="z-index: 2"></div>
      <div id="m3" data-composition-id="m3" data-composition-src="compositions/m3.html" data-start="18.95" data-duration="8.45"
        data-track-index="3" data-track-kind="graphics" data-width="720" data-height="1280" style="z-index: 2"></div>
      <div id="mburst" data-composition-id="mburst" data-composition-src="compositions/mburst.html" data-start="27.4" data-duration="2.6"
        data-track-index="4" data-track-kind="graphics" data-width="720" data-height="1280" style="z-index: 3"></div>

      <!-- 10 s outro: the same Remotion logo + offer, laid out for portrait (video/outro, OutroVertical) -->
      <video id="outro" class="clip" data-start="30" data-duration="10" data-track-index="5" src="assets/footage/outro.mp4"
        muted playsinline style="position: absolute; left: 0; top: 0; width: 720px; height: 1280px; z-index: 4"></video>

      <audio id="sfx" class="clip" data-start="0" data-duration="40" data-track-index="6" data-volume="1" src="assets/sfx/sfx.wav"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#ground-a", { x: 0, y: 0 }, { x: -120, y: 80, duration: 30, ease: "sine.inOut" }, 0);
      tl.fromTo("#ground-b", { x: 0, y: 0 }, { x: 110, y: -60, duration: 30, ease: "sine.inOut" }, 0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
