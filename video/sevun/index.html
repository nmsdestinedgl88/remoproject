<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --paper: #F7F3EE;
        --ink: #22162F;
        --orange: #FF6600;
        --purple: #7851A9;
        --font-display: "Outfit", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); }
      #root { width: 100%; height: 100%; position: relative; font-family: var(--font-display); }
      #ground { position: absolute; inset: 0; background: var(--paper); overflow: hidden; z-index: 0; }
      #ground-a { position: absolute; width: 1300px; height: 1300px; border-radius: 50%; top: -620px; right: -420px;
        background: radial-gradient(circle, rgba(255, 102, 0, 0.16), transparent 62%); filter: blur(60px); }
      #ground-b { position: absolute; width: 1100px; height: 1100px; border-radius: 50%; bottom: -560px; left: -380px;
        background: radial-gradient(circle, rgba(120, 81, 169, 0.14), transparent 64%); filter: blur(70px); }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="50"
      data-width="1920"
      data-height="1080"
    >
      <div id="ground" class="clip" data-start="0" data-duration="40" data-track-index="0" data-layout-ignore>
        <div id="ground-a"></div>
        <div id="ground-b"></div>
      </div>

      <div id="s1" data-composition-id="s1" data-composition-src="compositions/s1.html" data-start="0" data-duration="9.75"
        data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 2"></div>
      <div id="s2" data-composition-id="s2" data-composition-src="compositions/s2.html" data-start="9.75" data-duration="9.7"
        data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 2"></div>
      <div id="s3" data-composition-id="s3" data-composition-src="compositions/s3.html" data-start="19.45" data-duration="8.4"
        data-track-index="3" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 2"></div>
      <div id="s4" data-composition-id="s4" data-composition-src="compositions/s4.html" data-start="27.85" data-duration="9.7"
        data-track-index="4" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 2"></div>
      <div id="burst" data-composition-id="burst" data-composition-src="compositions/burst.html" data-start="37.55" data-duration="2.45"
        data-track-index="5" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 3"></div>

      <!-- 10 s outro: animated logo + offer, built and rendered in Remotion (video/outro) -->
      <video id="outro" class="clip" data-start="40" data-duration="10" data-track-index="6" src="assets/footage/outro.mp4"
        muted playsinline style="position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 4"></video>

      <!-- designed sound (onetake palette, one room), under the dialogue -->
      <audio id="sfx" class="clip" data-start="0" data-duration="50" data-track-index="7" data-volume="1" src="assets/sfx/sfx.wav"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#ground-a", { x: 0, y: 0 }, { x: -180, y: 90, duration: 40, ease: "sine.inOut" }, 0);
      tl.fromTo("#ground-b", { x: 0, y: 0 }, { x: 160, y: -70, duration: 40, ease: "sine.inOut" }, 0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
