<!doctype html><html><head><meta charset="utf-8"><style>
:root{--p:#800080;--c:#333333;--c2:#6b6b6b}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;position:relative;font-family:Inter,sans-serif;color:var(--c);background:#eee}
#bg{position:absolute;inset:-60px;background:url(assets/paper.png) center/cover}
.m{font-family:'DejaVu Sans Mono',monospace}
.form{position:absolute;left:90px;width:900px;background:#fff;box-shadow:0 20px 50px #0003;padding:56px 60px 40px;border-top:24px solid var(--p);opacity:0}
.kick{font-size:34px;color:var(--p);font-weight:700;letter-spacing:.04em}
.ttl{font-weight:700;margin:22px 0 18px;line-height:1.1}
.ln{border-bottom:3px solid var(--c);padding:30px 0;font-size:46px;display:flex;justify-content:space-between;gap:30px;opacity:0}
.ln b{text-align:right}
.big{font-weight:700;color:var(--p);line-height:1}
.stamp{position:absolute;border:10px solid var(--p);color:var(--p);font-weight:800;padding:16px 34px;font-size:72px;letter-spacing:.1em;background:#ffffffcc;opacity:0;white-space:nowrap}
.stamp.dk{border-color:var(--c);color:var(--c)}
#logo{position:absolute;left:50%;transform:translateX(-50%);bottom:150px;width:200px}
#foot{position:absolute;left:90px;right:90px;bottom:48px;font-size:26px;color:var(--c2);text-align:center;line-height:1.3}
#bar{position:absolute;left:0;bottom:0;height:10px;background:var(--p)}
#cta{position:absolute;left:90px;width:900px;top:1330px;background:var(--p);color:#fff;font-size:42px;white-space:nowrap;font-weight:800;padding:34px 10px;text-align:center;border-radius:20px;opacity:0}
#hook{position:absolute;left:90px;top:120px;width:900px;font-size:44px;font-weight:700;color:var(--c);opacity:0}
</style></head><body><div id="bg"></div><div id="stage"></div>
<div id="cta">Message Manetrust Solutions to start</div>
<img id="logo" src="assets/logo.png"><div id="foot">No grant is guaranteed. Dates and rules change: confirm on each funder's official site.</div><div id="bar"></div>
<script>
const D=46;
const S=[
{a:0,b:5,top:300,rot:-1,kick:'FORM 2027 / FUNDING',ttl:'3 grants<br>for Nigerian<br>businesses',tsz:84,lines:[['Local','$5,000'],['European','€2.5M'],['Global','$150K']],lt:[1.6,2.4,3.2],stamp:{t:'OPEN',x:640,y:1000,r:-9,at:3.9}},
{a:5,b:14,top:250,rot:.8,kick:'GRANT 1 OF 3 · LOCAL',ttl:'Tony Elumelu<br>Foundation',tsz:64,big:'$5,000',lines:[['Type','non-refundable seed'],['Also','training + mentoring'],['Founder','18+'],['Business age','under 5 years'],['Fee','free to apply']],lt:[1.6,2.6,3.6,4.6,5.6],stamp:{t:'MATCH',x:580,y:1180,r:-10,at:7}},
{a:14,b:24,top:250,rot:-.8,kick:'GRANT 2 OF 3 · EUROPEAN',ttl:'EIC Accelerator<br>(Horizon Europe)',tsz:60,big:'up to €2.5M',lines:[['Covers','up to 70% of costs'],['Short form','open to Nigerians'],['Full form','EU base needed']],lt:[1.8,3.2,4.8],stamp:{t:'APPLY',x:520,y:1130,r:-10,at:7.2}},
{a:24,b:33,top:250,rot:.8,kick:'GRANT 3 OF 3 · GLOBAL',ttl:'Google for Startups<br>Black Founders Fund',tsz:56,big:'up to $150K',lines:[['Type','equity-free cash'],['Plus','cloud credits'],['Nigeria','top winner group'],['Next','watch official site']],lt:[1.6,2.8,4,5.2],stamp:{t:'WATCH',x:600,y:1180,r:-9,at:6.6}},
{a:33,b:38,top:300,rot:-1,kick:'APPLICATION CHECKLIST',ttl:'The money exists.<br>The paperwork<br>stops you.',tsz:72,lines:[['Pitch pack','not ready'],['Funder rules','unclear'],['Deadlines','missed']],lt:[1.6,2.3,3],stamp:{t:'INCOMPLETE',x:520,y:1090,r:-9,at:3.6,dk:1}},
{a:38,b:46,top:230,rot:.8,kick:'TRUST APPLICATION SERVICE',ttl:'Manetrust Solutions',tsz:56,big:'₦10,000 /month',bsz:90,lines:[['☑ Pitch pack','refined'],['☑ Sent out','to funders'],['☑ Application','run for you']],lt:[1.2,2.2,3.2],stamp:{t:'SUBMITTED',x:480,y:960,r:-10,at:4.4},cta:4.9}
];
const st=document.getElementById('stage');
S.forEach((s,i)=>{
 const f=document.createElement('div');f.className='form m';f.style.top=(s.top+110)+'px';
 f.innerHTML=`<div class="kick">${s.kick}</div><div class="ttl" style="font-size:${s.tsz}px">${s.ttl}</div>`+(s.big?`<div class="big" style="font-size:${s.bsz||110}px;margin:6px 0 22px">${s.big}</div>`:'')+s.lines.map(l=>`<div class="ln"><span>${l[0]}</span><b>${l[1]}</b></div>`).join('');
 st.appendChild(f);s.f=f;
 const k=document.createElement('div');k.className='stamp m'+(s.stamp.dk?' dk':'');k.textContent=s.stamp.t;k.style.left=s.stamp.x+'px';
 st.appendChild(k);s.k=k;k.style.top=(f.offsetTop+f.offsetHeight+5)+'px';
});
const e=x=>1-Math.pow(1-Math.min(1,Math.max(0,x)),3);
const bounce=x=>{x=Math.min(1,Math.max(0,x));return x<.6?x/.6*1.0:1+Math.sin((x-.6)/.4*Math.PI)*.0}
function seek(t){
 document.getElementById('bg').style.transform=`translate(${-t*1.2}px,${-t*.8}px) scale(1.02)`;
 S.forEach(s=>{
  const lt=t-s.a, dur=s.b-s.a;
  const inn=e(lt/.7), out=e((dur-lt)/.5);
  const vis=lt>=0&&t<s.b;
  s.f.style.opacity=vis?Math.min(inn,out):0;
  s.f.style.transform=`translateY(${(1-inn)*120-(1-out)*80}px) rotate(${s.rot*(0.4+0.6*inn)}deg)`;
  [...s.f.querySelectorAll('.ln')].forEach((l,j)=>{const k=e((lt-s.lt[j])/.5);l.style.opacity=k;l.style.transform=`translateX(${(1-k)*-50}px)`});
  const q=(lt-s.stamp.at)/.35, sk=Math.min(1,Math.max(0,q));
  s.k.style.opacity=vis&&q>0?Math.min(1,sk*1.6)*Math.min(1,out*2):0;
  s.k.style.transform=`rotate(${s.stamp.r}deg) scale(${1+(1-e(q))*0.9})`;
  if(s.cta){const c=document.getElementById('cta');const k2=e((lt-s.cta)/.5);c.style.opacity=vis?k2:0;c.style.transform=`translateY(${(1-k2)*40}px)`}
 });
 document.getElementById('bar').style.width=(t/D*100)+'%';
}
</script></body></html>
